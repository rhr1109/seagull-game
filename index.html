// Stats helper
function changeStatSafe(key, delta) {
  if (!RUN || !RUN.stats) return;
  if (RUN.stats[key] == null) RUN.stats[key] = 0;
  RUN.stats[key] = clamp(RUN.stats[key] + delta, 0, 100);
}

function triggerEnding(id) {
  if (RUN.finished) return;
  RUN.finished = true;
  window._lastEndingId = id;
  const def = ENDING_DEFS[id];
  if (!def) return;
  closeModal();
  INPUT.left = INPUT.right = INPUT.up = INPUT.down = INPUT.jump = false;
  AUDIO.stopBgm();
  // ending-specific reactions
  if (id === 1 || id === 4 || id === 13) { AUDIO.sfx('death'); screenFlash('rgba(0,0,0,0.7)', 36); }
  else if (id === 8) { AUDIO.sfx('kkeuh'); screenFlash('rgba(180,180,200,0.5)', 30); }
  else if (id === 20) { AUDIO.sfx('success'); spawnFireworks(20); screenFlash('rgba(255,240,180,0.7)', 50); }
  else if (id === 23) { AUDIO.sfx('coin'); spawnFireworks(15); screenFlash('rgba(244,196,48,0.5)', 30); spawnHearts(cv.width*0.5, cv.height*0.5, 20); }
  else if (id === 24) { AUDIO.sfx('kkeuh'); AUDIO.beep(700,0.3,'sine',0.3,-300); screenFlash('rgba(255,150,200,0.4)', 40); }
  else { AUDIO.sfx('success'); spawnFireworks(8); screenFlash('rgba(255,255,255,0.5)', 24); }
  // unlock title
  if (def.title) {
    META.titlesUnlocked = META.titlesUnlocked || [];
    if (!META.titlesUnlocked.includes(def.title)) META.titlesUnlocked.push(def.title);
  }
  // newly unlocked costume becomes the selected one for next run
  if (def.costume && !META.costumesUnlocked.includes(def.costume)) {
    META.selectedCostume = def.costume;
  }
  // record meta
  const wasNew = !META.endingsUnlocked.includes(id);
  if (wasNew) META.endingsUnlocked.push(id);
  if (def.costume && !META.costumesUnlocked.includes(def.costume)) META.costumesUnlocked.push(def.costume);
  META.totalRuns = (META.totalRuns|0) + 1;
  META.totalCigSmoked = (META.totalCigSmoked|0) + (RUN.cigarettesSmokedTotal|0);
  META.endingsReachedCount = META.endingsReachedCount || {};
  META.endingsReachedCount[id] = (META.endingsReachedCount[id]||0) + 1;
  const ok = saveMeta();
  console.log('[ending]', id, def.name, 'unlocked total:', META.endingsUnlocked.length, 'saved:', ok);
  if (ok) {
    if (wasNew) setTimeout(() => toast(`📔 새 엔딩 해금: ${def.name} · 자동 저장됨`, 'good'), 600);
    else setTimeout(() => toast(`✅ ${def.name} 도달 (자동 저장됨)`, 'good'), 600);
  } else {
    setTimeout(() => toast('⚠ 저장 실패 — 메뉴 → 백업으로 수동 저장 권장', 'bad'), 600);
  }
  clearRun();

  // show ending screen
  const screen = document.getElementById('endingScreen');
  document.getElementById('endingTitle').textContent = def.name;
  document.getElementById('endingSummary').textContent = def.flavor;
  const reward = document.getElementById('endingReward');
  reward.style.display = '';
  reward.textContent = `🎁 코스튬 해금: ${def.costumeName}`;
  // draw ending portrait
  const ec = document.getElementById('endingCanvas');
  drawEndingPortrait(ec, def.costume);
  screen.classList.add('show');
}

function drawEndingPortrait(canvas, costume) {
  const ec = canvas.getContext('2d');
  ec.imageSmoothingEnabled = false;
  ec.fillStyle = '#3a4358';
  ec.fillRect(0,0,canvas.width,canvas.height);
  // draw seagull at center
  // temp swap globals... but easier: pass override
  const oldFrame = animFrame; const oldBob = bobTime;
  animFrame = 0; bobTime = 0;
  drawSeagull(ec, canvas.width/2, canvas.height/2 + 10, costume, { dead: costume==='patient' && false, forceCig: true });
  animFrame = oldFrame; bobTime = oldBob;
}

  closeModal();

}

function showAlbum(opts={}) {
  const totalEndings = ENDING_DEFS.length - 1; // entry 0 is null
  let html = '<div class="album-grid">';
  for (let i=1;i<=totalEndings;i++) {
    const def = ENDING_DEFS[i];
    if (!def) continue;
    const unlocked = META.endingsUnlocked.includes(i);
    const cls = unlocked ? '' : 'locked';
    // hidden endings keep ??? until unlocked; normal endings always show name + title hint
    const showName = unlocked || !def.hidden;
    const displayName = showName ? def.name : '🔒 ???';
    const displayTitle = (def.title && (unlocked || !def.hidden)) ? def.title : null;
    html += `<div class="album-card ${cls}">
      <div class="id">${('0'+i).slice(-2)}</div>
      ${def.hidden ? '<div class="hidden-tag">HIDDEN</div>' : ''}
      <div class="frame"><canvas data-cos="${def.costume}" data-locked="${!unlocked}" width="120" height="100"></canvas></div>
      <div class="name">${escapeHtml(displayName)}</div>
      ${displayTitle ? `<div style="font-size:10px;color:var(--c-accent);margin:2px 0 3px">🏆 ${escapeHtml(displayTitle)}</div>` : ''}
      <div class="dim">${unlocked ? escapeHtml(def.flavor) : (def.hidden ? '히든 엔딩' : '미해금 — 진행도 모달에서 조건 확인')}</div>
    </div>`;
  }
  html += '</div>';
  html += `<hr><div class="dim">해금: ${META.endingsUnlocked.length}/${totalEndings} · 총 회차: ${META.totalRuns} · 최장수: ${META.longestLife}일 · 총 흡연: ${META.totalCigSmoked}</div>`;
  html += `<div style="margin-top:8px"><button id="albumShareBtn" style="width:100%;padding:8px;background:var(--c-panel-2);border:1px solid var(--c-line);color:var(--c-text);border-radius:6px;font-size:12px;cursor:pointer">📤 SNS 공유</button></div>`;
  // milestone
  let milestoneHtml = '<hr><div class="dim">누적 마일스톤</div>';
  const mls = [
    [3,  '신규 사냥터: 도시 옥상 (점심/저녁)'],
    [5,  '신규 사냥터: 지하철 입구'],
    [8,  '신규 BGM 트랙 + 매 턴 욕구/포만감 누적 감소'],
    [10, '시작 모든 스탯 +5 메타 보너스'],
    [13, '인벤 C급 ×2 시작 보너스'],
    [16, '시작 인벤 B급 ×1'],
    [18, '시작 모든 스탯 +10'],
    [19, '진엔딩 #20 "갈매기 신" 트리거 해금'],
    [21, '전체 도달 — 모든 코스튬에 색상 변형 추가 (예정)']
  ];
  for (const [n, label] of mls) {
    const met = META.endingsUnlocked.length >= n;
    milestoneHtml += `<div class="dim">${met?'✅':'⬜'} ${n}개 — ${label}</div>`;
  }
  html += milestoneHtml;
  openModal('📔 꽁초의 일대기', html, { allowOverEnding: opts.allowOverEnding });
  const sBtn = document.getElementById('albumShareBtn');
  if (sBtn) sBtn.addEventListener('click', () => shareProgress());
  // draw portraits
  document.querySelectorAll('#modalBody canvas').forEach(c => {
    const ec = c.getContext('2d');
    ec.imageSmoothingEnabled = false;
    ec.fillStyle = '#1a1f28';
    ec.fillRect(0,0,c.width,c.height);
    if (c.dataset.locked === 'true') {
      ec.fillStyle = '#444';
      ec.font = '40px sans-serif';
      ec.textAlign = 'center';
      ec.fillText('?', c.width/2, c.height/2 + 15);
    } else {
      const old = animFrame; animFrame = 0;
      drawSeagull(ec, c.width/2, c.height/2 + 6, c.dataset.cos, { forceCig: true });
      animFrame = old;
    }
  });
}

// Title-screen slot chooser. mode: 'continue' (saved only), 'new' (any slot, warn on overwrite)
function showSlotPicker(mode) {
  let html;
  if (mode === 'continue') {
    html = '<p class="dim">이어할 갈매기를 선택하세요.</p>';
  } else {
    html = '<p class="dim">새 갈매기를 시작할 슬롯. 진행 중 슬롯을 고르면 덮어쓸지 확인합니다.</p>';
  }
  html += '<div class="slot-list" id="pickList"></div>';
  openModal(mode === 'continue' ? '▶ 이어하기' : '＋ 새 갈매기 시작', html);
  const list = document.getElementById('pickList');
  let visible = 0;
  for (let i=0;i<SLOT_COUNT;i++) {
    const data = loadRunFromSlot(i);
    if (mode === 'continue' && !data) continue;
    visible++;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'slot-card' + (data ? '' : ' empty');
    btn.setAttribute('aria-label', data ? `슬롯 ${i+1} ${mode==='continue'?'이어하기':'덮어쓰기'}` : `슬롯 ${i+1} 새 시작`);
    if (data) {
      const cosName = (COSTUME_EFFECTS[data.costume]||{}).name || '기본 꽁초';
      const t = TIMES[data.timeIdx||0];
      btn.innerHTML = `
        <div class="slot-info">
          <b>슬롯 ${i+1} · Day ${data.day} ${escapeHtml(t.icon||'')}</b>
          <span class="meta">${escapeHtml(cosName)} · 폐 ${Math.round(data.stats.lung)} · 평판 ${Math.round(data.stats.reputation)}</span>
        </div>`;
      btn.addEventListener('click', () => {
        if (mode === 'new') {
          if (!confirm(`슬롯 ${i+1}의 Day ${data.day} 갈매기를 덮어쓸까? (되돌릴 수 없음)`)) return;
          clearSlot(i);
          META.currentSlot = i; saveMeta();
          closeModal();
          newGame();
        } else {
          META.currentSlot = i; saveMeta();
          RUN = loadRunFromSlot(i);
          closeModal();
          hideTitle();
          document.getElementById('endingScreen').classList.remove('show');
          AUDIO.resume(); AUDIO.startBgm();
          updateUI();
          logLine(`▶ 슬롯 ${i+1} 이어하기 (Day ${RUN.day})`);
        }
      });
    } else {
      btn.innerHTML = `
        <div class="slot-info">
          <b>슬롯 ${i+1} · 빈 슬롯</b>
          <span class="meta">＋ 새 갈매기</span>
        </div>`;
      btn.addEventListener('click', () => {
        META.currentSlot = i; saveMeta();
        closeModal();
        newGame();
      });
    }
    list.appendChild(btn);
  }
  if (visible === 0) {
    list.innerHTML = '<p class="dim">진행 중인 갈매기가 없습니다. "새 갈매기 시작"으로 시작해주세요.</p>';
  }
}

function showSlotSwitch() {
  // Save current run before switching
  if (RUN && !RUN.finished) saveRun();
  let html = '<p class="dim">현재 슬롯의 진행은 자동 저장됨. 다른 슬롯으로 이동:</p><div class="slot-list" id="swapList"></div>';
  openModal('🔄 슬롯 전환', html);

function showBackup() {
  const json = JSON.stringify(META, null, 2);
  const today = new Date().toISOString().slice(0,10);
  const unlocked = (META.endingsUnlocked||[]).length;
  const titleCount = (META.titlesUnlocked||[]).length;
  const cosCount = (META.costumesUnlocked||[]).length;
  let html = `
    <div style="background:rgba(123,196,127,0.1);border:1px solid rgba(123,196,127,0.3);padding:8px 10px;border-radius:6px;font-size:12px;margin-bottom:10px">
      ✅ <b>엔딩 자동 로컬 저장됨</b><br>
      <span class="dim">엔딩 ${unlocked}/${ENDING_DEFS.length-1} · 칭호 ${titleCount} · 코스튬 ${cosCount} · 회차 ${META.totalRuns||0}</span>
    </div>
    <p class="dim">localStorage 메인 키 + 백업 키 동시 보관. 캐시가 날아갈 위험에 대비해 아래 백업 사용.</p>
    <div class="menu-list">
      <button id="bkDownload">💾 JSON 파일로 다운로드</button>
      <button id="bkImport">📥 백업 파일 불러오기</button>
      <button id="bkCopy">📋 클립보드로 복사</button>
    </div>
    <hr>
    <p class="dim">현재 메타 데이터 미리보기</p>
    <textarea id="bkPreview" readonly style="width:100%;height:120px;background:#14181F;color:var(--c-text-dim);border:1px solid var(--c-line);border-radius:6px;padding:6px;font-size:10px;font-family:monospace">${escapeHtml(json)}</textarea>
    <input type="file" id="bkFile" accept=".json,application/json" style="display:none">`;
  openModal('💾 데이터 백업 / 복원', html);
  // Programmatic download (a-tag with button child was breaking on some browsers)
  document.getElementById('bkDownload').onclick = () => {
    try {
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `kkeuh-meta-${today}.json`;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('💾 파일 저장됨', 'good');
    } catch(e) {
      console.error('download failed', e);
      const dataUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(json);
      const a2 = document.createElement('a');
      a2.href = dataUrl;
      a2.download = `kkeuh-meta-${today}.json`;
      a2.click();
      toast('💾 파일 저장됨 (대체 모드)', 'warn');
    }
  };
  document.getElementById('bkImport').onclick = () => document.getElementById('bkFile').click();
  document.getElementById('bkCopy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(json);
      toast('📋 클립보드에 복사됐다','good');
    } catch(e) {
      const ta = document.getElementById('bkPreview');
      ta.select(); ta.setSelectionRange(0, 999999);
      try { document.execCommand('copy'); toast('📋 복사됐다','good'); }
      catch(e2) { toast('복사 실패 — 박스에서 직접 복사하세요','warn'); }
    }
  };
  document.getElementById('bkFile').onchange = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!obj || typeof obj !== 'object' || !Array.isArray(obj.endingsUnlocked)) throw new Error('format');
        if (!confirm(`백업을 복원할까? 현재 메타 데이터는 덮어쓰여집니다.\n해금된 엔딩: ${(obj.endingsUnlocked||[]).length}개`)) return;
        META = Object.assign(defaultMeta(), obj);
        saveMeta();
        closeModal();
        toast('✅ 복원 완료','good');
        showTitle();
      } catch(err) {
        alert('파일 형식 오류: ' + err.message);
      }
    };
    reader.readAsText(f);
  };
}

function shareProgress(opts={}) {
  const totalEndings = ENDING_DEFS.length - 1;
  const unlocked = META.endingsUnlocked.length;
  let text;
  if (opts.endingId && ENDING_DEFS[opts.endingId]) {
    const def = ENDING_DEFS[opts.endingId];
    text = `🚬🐦 끄어억에서 [${def.name}] 엔딩에 도달했다! (${unlocked}/${totalEndings} 해금)\n"끼룩이 아니라 끄어억"\nhttps://seagull-game-rhr1109.vercel.app`;
  } else {

  }
  const data = {
    title: '끄어억 — 부둣가 골초 갈매기',
    text,
    url: 'https://seagull-game-rhr1109.vercel.app'
  };

    navigator.share(data).catch(e => {

      () => promptCopyFallback(text)

function showStats() {
  const totalEndings = ENDING_DEFS.length - 1;
  const unlockedCount = META.endingsUnlocked.length;
  const costumeCount = (META.costumesUnlocked||[]).length;

  const reached = META.endingsReachedCount || {};
  let totalReaches = 0;
  let topEndingId = null, topEndingCount = 0;
  for (const id of Object.keys(reached)) {
    const c = reached[id]||0;
    totalReaches += c;
    if (c > topEndingCount) { topEndingCount = c; topEndingId = parseInt(id); }
  }
  const topName = (topEndingId && ENDING_DEFS[topEndingId]) ? ENDING_DEFS[topEndingId].name : '없음';
  let html = `
    <p><b>📊 누적 진행</b></p>
    <div class="stats-detail-row"><span>총 회차 수</span><span class="dim">${META.totalRuns || 0}회</span></div>
    <div class="stats-detail-row"><span>최장 수명</span><span class="dim">${META.longestLife || 0}일</span></div>
    <div class="stats-detail-row"><span>총 흡연량</span><span class="dim">${META.totalCigSmoked || 0}개비</span></div>
    <div class="stats-detail-row"><span>총 엔딩 도달</span><span class="dim">${totalReaches}회 (중복 포함)</span></div>
    <hr>
    <p><b>🏆 컬렉션</b></p>
    <div class="stats-detail-row"><span>해금된 엔딩</span><span class="dim">${unlockedCount}/${totalEndings} 종</span></div>
    <div class="stats-detail-row"><span>보유 코스튬</span><span class="dim">${costumeCount}/25 종</span></div>
    <div class="stats-detail-row"><span>보유 칭호</span><span class="dim">${titleCount}/${totalEndings} 종</span></div>
    <div class="stats-detail-row"><span>활성 메타 보너스</span><span class="dim">${META_BONUSES.filter(b => unlockedCount >= b.req).length}/${META_BONUSES.length} 종</span></div>
    <hr>
    <p><b>👑 가장 많이 도달한 엔딩</b></p>
    <div class="stats-detail-row"><span>${escapeHtml(topName)}</span><span class="dim">${topEndingCount}회 도달</span></div>`;

  if (totalReaches > 0) {
    html += `<details style="margin-top:8px"><summary>📈 엔딩별 도달 횟수</summary><div>`;
    for (let i=1;i<=totalEndings;i++) {
      const c = reached[i] || 0;
      const def = ENDING_DEFS[i];
      if (!def) continue;
      const name = META.endingsUnlocked.includes(i) ? def.name : (def.hidden ? '🔒 ???' : '???');
      html += `<div class="stats-detail-row"><span>#${i} ${escapeHtml(name)}</span><span class="dim">${c}회</span></div>`;
    }
    html += `</div></details>`;
  }

  // Current run snapshot
  if (!RUN.finished && RUN.day) {
    html += `<hr><p><b>📍 현재 회차</b></p>`;
    html += `<div class="stats-detail-row"><span>슬롯 ${(META.currentSlot|0)+1} · Day ${RUN.day}/30</span><span class="dim">총 흡연 ${RUN.cigarettesSmokedTotal||0}개</span></div>`;
  }

  openModal('📈 누적 통계', html);
}

function showTitle() {
  document.getElementById('titleScreen').style.display = '';
  closeModal();
  // 이어하기 버튼은 저장된 슬롯이 하나라도 있을 때만 노출
  const cb = document.getElementById('continueBtn');
  const ng = document.getElementById('newGameBtn');
  let savedCount = 0, latestSave = null;
  for (let i=0;i<SLOT_COUNT;i++) {
    const d = loadRunFromSlot(i);
    if (d) { savedCount++; if (!latestSave || (d.day||0) > (latestSave.day||0)) latestSave = d; }
  }
  if (cb) {
    cb.classList.toggle('hidden', savedCount === 0);
    cb.style.display = savedCount > 0 ? '' : 'none';
    cb.textContent = savedCount > 0 ? `▶ 이어하기 (${savedCount}개 진행 중)` : '▶ 이어하기';
  }
  if (ng) {
    ng.classList.remove('hidden');
    ng.style.display = '';
  }
  // reset title-only particles
  titleSmokeParticles.length = 0;
  titleAshParticles.length = 0;
  titleCryTimer = 0;
  titleStretchTimer = 0;
  titleStretching = false;
}

function renderSlotList() {
  const list = document.getElementById('slotList');
  if (!list) return;
  list.innerHTML = '';
  for (let i=0;i<SLOT_COUNT;i++) {
    const data = loadRunFromSlot(i);
    const card = document.createElement('button');
    card.type = 'button';
    const isActive = (META.currentSlot === i);
    card.className = 'slot-card' + (data ? '' : ' empty') + (isActive && data ? ' active-slot' : '');
    card.setAttribute('aria-label', data ? `슬롯 ${i+1} 이어하기` : `슬롯 ${i+1} 새 시작`);
    if (data) {
      const cosName = (COSTUME_EFFECTS[data.costume] || {}).name || '기본 꽁초';
      const t = TIMES[data.timeIdx || 0];
      card.innerHTML = `
        <div class="slot-info">
          <b>슬롯 ${i+1} · Day ${data.day} ${escapeHtml(t.icon||'')}</b>
          <span class="meta">${escapeHtml(cosName)} · 폐 ${Math.round(data.stats.lung)} · 평판 ${Math.round(data.stats.reputation)}</span>
        </div>
        <div class="slot-action">
          <button class="slot-del" data-idx="${i}" title="삭제">🗑</button>
        </div>`;
      card.addEventListener('click', (e) => {
        if (e.target.classList.contains('slot-del')) return;
        META.currentSlot = i;
        saveMeta();
        RUN = loadRunFromSlot(i);
        hideTitle();
        document.getElementById('endingScreen').classList.remove('show');
        AUDIO.resume(); AUDIO.startBgm();
        updateUI();
        logLine(`▶ 슬롯 ${i+1} 이어하기 (Day ${RUN.day})`);
      });
    } else {
      card.innerHTML = `
        <div class="slot-info">
          <b>슬롯 ${i+1} · 빈 슬롯</b>
          <span class="meta">+ 새 갈매기 시작</span>
        </div>
        <div class="slot-action">
          <span style="color:var(--c-text-dim);font-size:18px">＋</span>
        </div>`;
      card.addEventListener('click', () => {
        META.currentSlot = i;
        saveMeta();
        newGame();
      });
    }
    list.appendChild(card);
  }
  // bind delete buttons
  list.querySelectorAll('.slot-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      if (confirm(`슬롯 ${idx+1}의 갈매기를 삭제할까? (되돌릴 수 없음)`)) {
        clearSlot(idx);
        renderSlotList();
      }
    });
  });
}
function hideTitle() {
  document.getElementById('titleScreen').style.display = 'none';
}

function newGame() {
  const wanted = META.selectedCostume || 'default';
  RUN = defaultRun();
  RUN.costume = META.costumesUnlocked.includes(wanted) ? wanted : 'default';
  applyCostumeEffects();
  const earnedBonuses = applyMetaBonuses();
  saveRun();
  hideTitle();
  document.getElementById('endingScreen').classList.remove('show');
  closeModal();
  updateUI();
  AUDIO.resume(); AUDIO.startBgm();
  AUDIO.sfx('kkiruk');
  logLine('Day 1: 부둣가에 또 하나의 한심한 갈매기가 깨어났다.');
  if (RUN.costume !== 'default') {
    const def = ENDING_DEFS.find(d => d && d.costume === RUN.costume);
    if (def) toast('🎩 코스튬 적용: ' + def.costumeName, 'good');
  }
  if (META.selectedTitle) toast('🏆 칭호: ' + META.selectedTitle, 'good');
  if (earnedBonuses && earnedBonuses.length > 0) {
    setTimeout(() => {
      toast(`✨ 메타 보너스 ${earnedBonuses.length}개 적용됨 (인벤 모달에서 확인)`, 'good');
    }, 2200);
  }
  showControlHint();
}

function showControlHint() {
  const hint = document.getElementById('controlHint');
  if (!hint) return;
  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  hint.textContent = isTouch
    ? '터치: 하단 ◀ ▶ 버튼 이동 · ▲ 점프 · 5개 액션 버튼 누르기'
    : 'PC: ← → 이동 · Space 점프 · 1~5 액션 단축키';
  hint.classList.add('show');
  clearTimeout(showControlHint._t);
  showControlHint._t = setTimeout(() => hint.classList.remove('show'), 6000);
}

  { req: 8,  desc:'매 턴 포만감 누적 -0.4 (덜 배고파짐)',     apply:(R,M)=>{ M.metaBonus_hungerReduce = (M.metaBonus_hungerReduce||0) + 0.4; } },
  { req: 9,  desc:'시작 동전 +15, 음식 +2',                apply:(R)=>{ R.money += 15; R.foodCount += 2; } },
  { req: 10, desc:'시작 모든 스탯 +5',                     apply:(R)=>{ for (const k of ['lung','flight','reputation']) R.stats[k] = clamp(R.stats[k]+5,0,100); R.stats.hunger = clamp(R.stats.hunger+5,0,100); } },
  { req: 12, desc:'시작 인벤 C급 ×2',                     apply:(R)=>{ R.inventory.C += 2; } },
  { req: 14, desc:'시작 폐 +10, 매 턴 욕구 -0.5 추가',     apply:(R,M)=>{ R.stats.lung = clamp(R.stats.lung+10,0,100); M.metaBonus_cravingReduce = (M.metaBonus_cravingReduce||0) + 0.5; } },
  { req: 16, desc:'시작 인벤 B급 ×1',                     apply:(R)=>{ R.inventory.B += 1; } },
  { req: 18, desc:'시작 모든 스탯 +10',                    apply:(R)=>{ for (const k of ['lung','flight','reputation']) R.stats[k] = clamp(R.stats[k]+10,0,100); R.stats.hunger = clamp(R.stats.hunger+10,0,100); } },
  { req: 20, desc:'전설의 갈매기: 모든 보너스 강화 + A급 ×1', apply:(R,M)=>{ R.inventory.A += 1; M.metaBonus_cravingReduce = (M.metaBonus_cravingReduce||0) + 0.5; M.metaBonus_hungerReduce = (M.metaBonus_hungerReduce||0) + 0.3; } }
];

function applyMetaBonuses() {
  // Reset per-run multipliers; META object holds the active values
  META.metaBonus_cravingReduce = 0;
  META.metaBonus_hungerReduce = 0;
  const n = META.endingsUnlocked.length;
  const earned = [];
  for (const b of META_BONUSES) {
    if (n >= b.req) { b.apply(RUN, META); earned.push(b); }
  }
  return earned;
}

function applyCostumeEffects() {
  const c = RUN.costume;
  switch(c) {
    case 'patient':
      RUN.stats.lung = clamp(RUN.stats.lung+20,0,100);
      RUN.stats.flight = clamp(RUN.stats.flight-10,0,100);
      break;
    case 'cigar_master':
      RUN.inventory.S++;
      RUN.stats.craving = clamp(RUN.stats.craving+30,0,100);
      break;
    case 'suit':
      RUN.stats.reputation = clamp(RUN.stats.reputation+20,0,100);
      break;
    case 'zombie':
      RUN.stats.reputation = clamp(RUN.stats.reputation-30,0,100);
      break;
    case 'pet':
      RUN.foodCount += 5;
      break;
    case 'thinker':
      // passive: stress regen handled at sleep
      break;
    case 'wedding':
      RUN.money += 50;
      break;
    case 'fog':
      // ghostly
      break;
    case 'sailor':
      RUN.stats.flight = clamp(RUN.stats.flight+15,0,100);
      break;
    case 'salaryman':
      RUN.stats.lung = clamp(RUN.stats.lung+10,0,100);
      RUN.stats.flight = clamp(RUN.stats.flight+10,0,100);
      RUN.stats.reputation = clamp(RUN.stats.reputation+10,0,100);
      break;
    case 'poet':
      RUN.stats.reputation = clamp(RUN.stats.reputation-15,0,100);
      RUN.stats.stress = clamp(RUN.stats.stress-10,0,100);
      break;
    case 'king':
      RUN.stats.reputation = clamp(RUN.stats.reputation+30,0,100);
      break;
    case 'skeleton':
      RUN.stats.flight = clamp(RUN.stats.flight-20,0,100);
      RUN.stats.hunger = clamp(RUN.stats.hunger-20,0,100);
      break;
    case 'princess':
      RUN.flags.humanAffinity = clamp(RUN.flags.humanAffinity+30,0,100);
      RUN.stats.reputation = clamp(RUN.stats.reputation-10,0,100);
      break;
    case 'pegasus':
      RUN.stats.flight = clamp(RUN.stats.flight+30,0,100);
      RUN.stats.craving = clamp(RUN.stats.craving+20,0,100);
      break;
    case 'master':
      RUN.flags.underlings = (RUN.flags.underlings||0) + 2;
      break;
    case 'rockstar':
      RUN.stats.lung = clamp(RUN.stats.lung-15,0,100);
      RUN.stats.reputation = clamp(RUN.stats.reputation+25,0,100);
      break;
    case 'painter':
      RUN.stats.flight = clamp(RUN.stats.flight-10,0,100);
      break;
    case 'killer':
      RUN.stats.reputation = clamp(RUN.stats.reputation-40,0,100);
      break;
    case 'god':
      RUN.stats.lung = 100; RUN.stats.flight = 100;
      RUN.stats.reputation = 100; RUN.stats.stress = 0;
      RUN.stats.craving = 0; RUN.stats.hunger = 100;
      RUN.stats.intel = 100; RUN.stats.charm = 100; RUN.stats.sense = 100;
      break;
    case 'lover':
      RUN.stats.charm = clamp((RUN.stats.charm||0)+30,0,100);
      RUN.stats.reputation = clamp(RUN.stats.reputation-10,0,100);
      break;
    case 'sage':
      RUN.stats.intel = clamp((RUN.stats.intel||0)+30,0,100);
      RUN.stats.sense = clamp((RUN.stats.sense||0)+20,0,100);
      RUN.stats.flight = clamp(RUN.stats.flight-15,0,100);
      break;
    case 'influencer':
      RUN.stats.charm = clamp((RUN.stats.charm||0)+25,0,100);
      RUN.flags.humanAffinity = clamp((RUN.flags.humanAffinity||0)+20,0,100);
      RUN.stats.lung = clamp(RUN.stats.lung-10,0,100);
      break;
    case 'catlike':
      RUN.flags.humanAffinity = clamp((RUN.flags.humanAffinity||0)+30,0,100);
      RUN.stats.reputation = clamp(RUN.stats.reputation-25,0,100);
      break;
  }
}

// ============================================================
// EVENT BINDINGS
// ============================================================
document.querySelectorAll('#actions .action-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (RUN.finished) return;
    if (btn.disabled) return;
    AUDIO.sfx('click');
    const a = btn.dataset.action;
    if (a === 'hunt') actionHunt();
    else if (a === 'smoke') actionSmoke();
    else if (a === 'explore') actionExplore();
    else if (a === 'interact') actionInteract();
    else if (a === 'sleep') actionSleep();
  });
});
document.addEventListener('keydown', (e) => {
  if (document.getElementById('titleScreen').style.display !== 'none') return;
  if (document.getElementById('modalBg').classList.contains('show')) return;
  if (RUN.finished) return;
  const map = {'1':'hunt','2':'smoke','3':'explore','4':'interact','5':'sleep'};
  const a = map[e.key];
  if (a) {
    const btn = document.querySelector(`[data-action="${a}"]`);
    if (btn && !btn.disabled) btn.click();
  }
  if (e.key === 'Escape') {
    if (document.getElementById('modalBg').classList.contains('show')) closeModal();
  }
});
document.getElementById('invBtn').addEventListener('click', () => { AUDIO.sfx('menu'); showInventory(); });
document.getElementById('albumBtn').addEventListener('click', () => { AUDIO.sfx('menu'); showAlbum(); });
document.getElementById('menuBtn').addEventListener('click', () => { AUDIO.sfx('menu'); showMenu(); });
document.getElementById('muteBtn').addEventListener('click', () => {
  const on = AUDIO.toggleMute();
  document.getElementById('muteBtn').textContent = on ? '🔊' : '🔇';
  toast(on ? '🔊 사운드 ON' : '🔇 사운드 OFF', '');
});
// Title: "이어하기" → slot picker. "새 갈매기" → first empty slot, fallback to picker if all full.
document.getElementById('newGameBtn').addEventListener('click', () => {
  let emptySlot = -1;
  for (let i=0;i<SLOT_COUNT;i++) {
    if (!loadRunFromSlot(i)) { emptySlot = i; break; }
  }
  if (emptySlot >= 0) {
    META.currentSlot = emptySlot;
    saveMeta();
    newGame();
  } else {
    // all 3 slots in use — let player pick one to overwrite
    showSlotPicker('new');
  }
});
document.getElementById('continueBtn').addEventListener('click', () => { showSlotPicker('continue'); });
document.getElementById('albumOpenBtn').addEventListener('click', showAlbum);
document.getElementById('creditsBtn').addEventListener('click', () => {
  openModal('크레딧', `
    <p><b>끄어억 — 부둣가 골초 갈매기 시뮬레이터</b></p>
    <p class="dim">기획: 마스터 문서 v2 기반</p>
    <p class="dim">개발: 단일 HTML 프로토타입</p>
    <p class="dim">아트: 절차적 캔버스 픽셀 (외부 에셋 0개)</p>
    <hr>
    <p>"꽁초를 문 갈매기 한 마리가 부두에 산다.</p>
    <p>그는 죽거나, 살거나, 사라진다.</p>
    <p>어느 쪽이든 부두는 그대로다."</p>
    <hr>
    <p class="dim">청소년이용불가. 그래야 할 만한 이유가 있다.</p>
  `);
});

// auto-save before close
window.addEventListener('beforeunload', () => { if (!RUN.finished) saveRun(); });
// Only react to actual screen-off / tab-hidden, not random window blurs
// (D-pad buttons and modal interactions can fire blur on PC; we don't want to kill BGM there)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (!RUN.finished) saveRun();
    AUDIO.stopBgm();
    if (AUDIO.master) try { AUDIO.master.gain.value = 0; } catch(e){}
  } else {
    if (AUDIO.master && AUDIO.enabled) try { AUDIO.master.gain.value = 0.7; } catch(e){}
    AUDIO.resume();
    const titleVisible = document.getElementById('titleScreen').style.display !== 'none';
    const endingVisible = document.getElementById('endingScreen').classList.contains('show');
    if (!RUN.finished && !titleVisible && !endingVisible && AUDIO.bgmEnabled && AUDIO.enabled) {
      AUDIO.startBgm();
    }
  }
});

// resize
window.addEventListener('resize', setCanvasSize);
window.addEventListener('orientationchange', setCanvasSize);

// ============================================================
// BOOT
// ============================================================
function boot() {
  migrateLegacySave();
  showTitle();
  setCanvasSize();
  setupSceneInput();
  setupKeyboardMovement();
  // resume audio on first user gesture (autoplay policy)
  const firstGesture = () => {
    AUDIO.resume();
    document.removeEventListener('pointerdown', firstGesture);
    document.removeEventListener('keydown', firstGesture);
  };
  document.addEventListener('pointerdown', firstGesture, { once:true });
  document.addEventListener('keydown', firstGesture, { once:true });
  loop();
}
boot();
</script>
